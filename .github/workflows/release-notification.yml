name: Release Notification Daily

on:
  schedule:
    # KST 09:00 = UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: release-notification-daily
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 개봉일 알림 발송
        env:
          API_URL: ${{ secrets.CINEMO_API_URL }}
          CRON_SECRET: ${{ secrets.CINEMO_CRON_SECRET }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${API_URL}/v1/release-notifications/cron" \
            --header "x-cron-secret: ${CRON_SECRET}"
